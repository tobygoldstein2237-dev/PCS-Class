<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .red {
            background-color: red;
            grid-column: 3;
            grid-row: 1 / 3;
        }

        .purple {
            background-color: purple;
            grid-column: 3 / 5;
            grid-row: 2;
            display: flex;
        }

        .brown {
            background-color: brown;
            grid-column: 3;
            grid-row: 3 / 5;
        }

        .green {
            background-color: green;
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .picture {
            display: grid;

            grid-template-columns: 1fr 60px 1fr;
            grid-template-rows: 1fr 60px 1fr;
            width: 300px;
            height: 300px;
        }
    </style>


</head>

<body>
    <div class="picture">
        <div class="red"></div>
        <div class="purple"></div>
        <div class="brown"></div>
        <div class="green"></div>
    </div>
</body>

</html>
