<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wikipedia Map Explorer</title>

    <style>
        html,
        body,
        #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }

        body {
            display: grid;
            grid-template-columns: 1fr 3fr;
        }

        #sidebar {
            border-right: 1px solid black;
            height: 100%;
            overflow: auto;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        #searchForm {
            display: flex;
        }

        #search {
            flex: 1;
            min-width: 0;
        }

        #clearBtn {
            margin: 10px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .marker-image,
        #sidebar img {
            width: 32px;
        }

        #places {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #places li {
            margin-top: 1em;
            border: 1px solid black;
            border-radius: 8px;
            cursor: pointer;
        }

        .info {
            display: flex;
            gap: 1em;
            padding-right: 2em;
        }

        #places li span {
            flex: 1;
            margin: auto;
            padding-left: 2em;
        }

        .summary {
            height: 0;
            transition: 2s;
            overflow: hidden;
        }

        .active {
            height: 6em;
        }
    </style>
</head>

<body>

    <div id="sidebar">

        <form id="searchForm">
            <input id="search" type="text" required />
            <button type="submit">go</button>
        </form>

        <button id="clearBtn" type="button">
            Clear All Places
        </button>

        <hr />

        <ul id="places"></ul>

    </div>

    <div id="map"></div>

    <script>
        ((g) => {
            var h, a, k,
                p = 'The Google Maps JavaScript API',
                c = 'google',
                l = 'importLibrary',
                q = '__ib__',
                m = document,
                b = window;

            b = b[c] || (b[c] = {});
            var d = b.maps || (b.maps = {}),
                r = new Set(),
                e = new URLSearchParams(),
                u = () =>
                    h ||
                    (h = new Promise(async (f, n) => {
                        await (a = m.createElement('script'));
                        e.set('libraries', [...r] + '');

                        for (k in g)
                            e.set(
                                k.replace(/[A-Z]/g,
                                    (t) => '_' + t[0].toLowerCase()),
                                g[k]
                            );

                        e.set('callback', c + '.' + l);
                        e.set('callback', c + '.maps.' + q);

                        a.src =
                            `https://maps.${c}apis.com/maps/api/js?` + e;

                        d[q] = f;
                        a.onerror = () =>
                            (h = n(Error(p + ' could not load.')));

                        a.nonce =
                            m.querySelector('script[nonce]')?.nonce || '';

                        m.head.append(a);
                    }));

            d[l]
                ? console.warn(
                    p + ' only loads once. Ignoring:', g)
                : (d[l] = (f, ...n) =>
                    r.add(f) && u().then(() => d[l](f, ...n)));

        })({
            key: 'YOUR_GOOGLE_MAPS_API_KEY',
            v: 'weekly'
        });
    </script>

    <script src="hw.js" type="module"></script>

</body>

</html>
