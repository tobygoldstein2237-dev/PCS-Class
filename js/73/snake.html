<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            background: #e9f4e7;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 12px 0 5px;
            color: darkgreen;
        }

        p {
            margin: 5px 0 10px;
        }

        #theCanvas {
            display: block;
            margin: 0 auto;
            background: white;
            border: 2px solid darkgreen;
            max-width: 100%;
        }

        button {
            margin: 10px;
            padding: 9px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Snake Game 🐍</h1>
    <p>Use the arrow keys to move. Eat apples to earn points!</p>
    <canvas id="theCanvas"></canvas>
    <button id="restart">Restart Game</button>
    <script src="snake.js" type="module"></script>
</body>

</html>
